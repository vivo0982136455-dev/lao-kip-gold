# Collect data every 30 minutes and save it into the repo (exchange rates, gold, silver, fuel in Thailand, daily
# rubber prices, and - at most every 6 hours - the official fuel prices in Laos).
# Note: GitHub may start scheduled runs late (sometimes 10-30+ minutes) when busy.
name: Fetch data

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC)
  workflow_dispatch:         # "Run workflow" button for manual runs
  push:                      # also when a script changes: a new or repaired source is tried on GitHub's
    branches: [main]         # servers at once (a source can work on a PC and still be refused there)
    paths:
      - ".github/workflows/fetch-data.yml"
      - "scripts/**"

permissions:
  contents: write            # needed to commit the data files

concurrency:
  group: fetch-data          # never run two at the same time
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The two actions are pinned to the exact commit (not to the tag "v4", which its owner can move): the run
      # executes the same code every time - release v4.4.0 of each (audit 2026-10-02, P2-9). To update: look up the commit of the
      # new release (git ls-remote https://github.com/actions/checkout refs/tags/v4) and change both workflow files.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # FETCH_EVENT: a run started by a push asks every source, also the ones that are normally asked only
      # every few hours (daily rubber prices, Lao fuel prices) - that run exists to try the changed scripts
      - name: Fetch all sources
        env:
          FETCH_EVENT: ${{ github.event_name }}
        run: node scripts/fetch-all.js

      - name: Check data files
        run: node scripts/check-data.js

      # Commit only when a data file really changed.
      # "if: always()" saves "stale" markers even if a step above failed.
      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No data changes - nothing to commit."
            exit 0
          fi
          git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase
          git push
