<!doctype html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!-- Content-Security-Policy: what this page may load and where it may send data (audit 2026-10-02, P2-9).
       GitHub Pages cannot send it as a header, so it is a meta tag - it must stay above every script and style.
         script   this site + the two CDNs of Chart.js and of the picture reader (Tesseract). No inline script and
                  no eval; 'wasm-unsafe-eval' = the picture reader's engine is WebAssembly.
         worker   this site (sw.js) + blob: (the picture reader starts its worker from a blob)
         style    this site + Google Fonts; no inline style
         connect  this site (data, texts), Google Forms / Sheets (the owner's price form), script.google.com (the
                  owner's own save script; its answer comes from *.googleusercontent.com), jsDelivr (the picture
                  reader fetches its engine and its language file)
         img      this site, data: (the icon below), blob: (the preview of a chosen picture)
       A change here needs: node tests/security.js -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://docs.google.com https://script.google.com https://*.googleusercontent.com https://cdn.jsdelivr.net; manifest-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lao Kip &amp; Gold</title>
  <meta name="theme-color" content="#0f1115">
  <!-- Install as an app (phone home screen / computer): name + icons in the manifest, offline copy by sw.js -->

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="กีบ &amp; ทอง">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23e0b43c%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2220%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22700%22 fill=%22%230f1115%22%3E%E2%82%AD%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- crossorigin on the outside files: only then may sw.js keep a copy of them for use without a connection -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Lao:wght@400;600&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <!-- Chart.js from CDN. "defer" = does not block the page; the numbers show first.
       integrity = the browser runs the file only when it is exactly the published chart.js 4.5.1 (the hash cdnjs
       itself publishes; the jsDelivr copy is the identical file).
       Some networks block cdnjs → js/chart-backup.js loads the same file from jsDelivr, then tells app.js to redraw. -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js" integrity="sha512-WoViKhKD4qI2WruSZqv9+kvM4WfFhUMQCLN4QlDTt5aU56fLQy2gYoxWIqlEnXqJy/+Ac5q/hk1oWfqnMDhwMA==" crossorigin="anonymous"></script>
  <script defer src="js/chart-backup.js"></script>
  <!-- modulepreload:start - every module of the app is asked for at once. Without these lines the browser finds the modules
       one level at a time (app.js -> pages -> their helpers), one network round trip per level.
       Made by scripts/update-preload.js - run it after adding or removing a file in js/. -->
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/charts.js">
  <link rel="modulepreload" href="js/format.js">

  <script type="module" src="js/app.js"></script>
