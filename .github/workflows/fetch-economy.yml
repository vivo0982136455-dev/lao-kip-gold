# Lao economy data (World Bank, IMF yearly + monthly CPI / gold), investor data (debt by creditor, FDI by country and
# UNCTAD's total for all investors, rubber), WFP prices of everyday goods, Thai food + rubber prices, the official land price decisions per province,
# the world rubber numbers (who sells, who buys, who grows it, world prices), who buys Lao rubber at which border
# price (UN Comtrade, Viet Nam Customs), the population numbers (World Bank, Lao Statistics Bureau / UNFPA), the
# central bank's own numbers (Bank of the Lao PDR: policy rate, reserve requirement, reserves, inflation), wages
# (ILO + exchange rates) and a look whether the World Bank has published a newer Lao Economic Monitor.
# Weekly: IMF and WFP publish on different days each month, weekly keeps us at most ~7 days behind.
name: Fetch economy data

on:
  schedule:
    - cron: "0 3 * * 1"      # every Monday, 03:00 UTC (10:00 Vientiane)
  workflow_dispatch:         # "Run workflow" button
  push:                      # also when one of the weekly scripts changes: a new or changed fetcher is tried
    branches: [main]         # on GitHub's servers the same day, not next Monday
    paths:
      - ".github/workflows/fetch-economy.yml"
      - "scripts/fetch-economy.js"
      - "scripts/fetch-invest.js"
      - "scripts/fetch-prices.js"
      - "scripts/fetch-thai-prices.js"
      - "scripts/fetch-land-decisions.js"
      - "scripts/fetch-rubber-world.js"
      - "scripts/fetch-rubber-borders.js"
      - "scripts/fetch-population.js"
      - "scripts/fetch-bol-policy.js"
      - "scripts/fetch-wages.js"
      - "scripts/fetch-report-watch.js"
      - "scripts/lib/**"

permissions:
  contents: write

concurrency:
  group: fetch-data          # same group as the 30-minute job, so they never push at the same time
  cancel-in-progress: false

jobs:
  economy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch economy data
        run: node scripts/fetch-economy.js

      # Numbers for the economy tabs: GDP structure, debt by creditor + repayment schedule, FDI by country, world rubber
      - name: Fetch investor data (World Bank IDS, IMF)
        if: always()
        timeout-minutes: 10
        run: node scripts/fetch-invest.js

      # "if: always()" = prices still update even if one economy source failed
      - name: Fetch prices of everyday goods (WFP)
        if: always()
        run: node scripts/fetch-prices.js

      # The Thai ministry price API is slow (~25 s per item); if it hangs, stop after 15 minutes and keep last week's prices
      - name: Fetch Thai food and rubber prices (Ministry of Commerce)
        if: always()
        timeout-minutes: 15
        run: node scripts/fetch-thai-prices.js

      # Which provinces have published an official land price decision (Lao Official Gazette); ~45 small pages
      - name: Check official land price decisions (Lao Official Gazette)
        if: always()
        timeout-minutes: 5
        run: node scripts/fetch-land-decisions.js

      # World rubber: sellers and buyers by country (UN Comtrade, free preview: one year per call), growers
      # (FAOSTAT bulk files, downloaded only when FAO has a new edition), monthly world prices (World Bank Pink Sheet).
      # Each part keeps last week's numbers when its source fails.
      - name: Fetch world rubber trade, production and prices
        if: always()
        timeout-minutes: 10
        run: node scripts/fetch-rubber-world.js

      # Who buys Lao rubber and at what border price: buyers per year (UN Comtrade), rubber imported from Laos by
      # month (Viet Nam Customs: one small public PDF per new month), farm-gate prices in the Philippines.
      - name: Fetch buyers and border prices of Lao rubber
        if: always()
        timeout-minutes: 10
        run: node scripts/fetch-rubber-borders.js

      # Population: yearly numbers and projections (World Bank), by province and age (Lao Statistics Bureau / UNFPA)
      - name: Fetch population numbers
        if: always()
        timeout-minutes: 10
        run: node scripts/fetch-population.js

      # The central bank's policy rate and reserve requirement (every change with its date), its foreign-exchange
      # reserves by month and this year's inflation: three small pages and one small workbook of bol.gov.la (the
      # server forgets its intermediate certificate, scripts/lib/aia.js completes the chain)
      - name: Fetch the central bank's policy rate, reserve requirement, reserves and inflation
        if: always()
        timeout-minutes: 5
        run: node scripts/fetch-bol-policy.js

      # Wages: the ILO's minimum-wage series and average earnings of 17 countries + market exchange rates
      # (the minimum wages in force today are hand-checked facts in data/invest-static.json)
      - name: Fetch wages (ILO) and exchange rates
        if: always()
        timeout-minutes: 5
        run: node scripts/fetch-wages.js

      # Is there a newer World Bank "Lao Economic Monitor" than the one the Policy tab quotes? (the tab then says so)
      - name: Look for a newer World Bank report
        if: always()
        timeout-minutes: 3
        run: node scripts/fetch-report-watch.js

      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No data changes - nothing to commit."
            exit 0
          fi
          git commit -m "data: economy update $(date -u +'%Y-%m-%d')"
          git pull --rebase
          git push
