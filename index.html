<!doctype html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lao Kip &amp; Gold</title>
  <meta name="theme-color" content="#0f1115">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23e0b43c%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-size=%2220%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22700%22 fill=%22%230f1115%22%3E%E2%82%AD%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- Chart.js from CDN. "defer" = does not block the page; the numbers show first.
       Some networks block cdnjs → load the same file from jsDelivr instead, then tell app.js to redraw. -->
  <script>
    function loadChartBackup() {
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js";
      s.onload = function () { window.dispatchEvent(new Event("chartjs-ready")); };
      document.head.appendChild(s);
    }
  </script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js" onerror="loadChartBackup()"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- App shell. All visible text comes from /i18n/<lang>.json (filled in by js/app.js). -->
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">₭</span>
        <span class="brand-text" data-i18n="site_title"></span>
      </div>
      <nav id="nav" aria-label="Menu"></nav>
      <div class="sidebar-foot">
        <div id="sidebar-lang" class="segmented small"></div>
      </div>
    </aside>
    <div id="backdrop" class="backdrop"></div>

    <div class="main">
      <header class="topbar">
        <button id="menu-btn" class="icon-btn" type="button" aria-controls="sidebar" aria-expanded="false"></button>
        <h1 id="page-title"></h1>
        <span id="topbar-updated" class="topbar-updated"></span>
      </header>

      <main id="view" class="view" tabindex="-1"></main>

      <footer class="site-footer">
        <p data-i18n="disclaimer"></p>
      </footer>
    </div>
  </div>
</body>
</html>
